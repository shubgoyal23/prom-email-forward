name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One publish at a time; a newer push to main supersedes an in-flight build.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-24.04-arm

    steps:
      # Actions are pinned to release versions; Dependabot (.github/dependabot.yml) keeps them current.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          # `production` is what the server pulls; the sha tag is kept for rollbacks.
          tags: |
            ghcr.io/${{ github.repository_owner }}/prom-email-forward:production
            ghcr.io/${{ github.repository_owner }}/prom-email-forward:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tells the VPS to pull the new `production` image. The body is signed
      # with DEPLOY_WEBHOOK_SECRET (repository secret) so the hook can verify it.
      - name: Notify VPS to deploy
        if: success() && github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_PROJECT: prom-email-forward
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date +%s)"
          delivery="${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body="$(printf '{"project":"%s"}' "$DEPLOY_PROJECT")"
          signature="$(
            printf '%s.%s' "$timestamp" "$body" |
              openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" |
              awk '{print $NF}'
          )"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -X POST 'https://deploy.230004.xyz/internal/deploy-hook' \
            -H 'Content-Type: application/json' \
            -H "X-Deploy-Timestamp: $timestamp" \
            -H "X-Deploy-Delivery: $delivery" \
            -H "X-Deploy-Signature: sha256=$signature" \
            --data-binary "$body"
